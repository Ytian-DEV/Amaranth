<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e5a36" />
    <meta name="description" content="Amaranth — the official student publication of Visayas State University, Baybay City, Leyte. News, sports, features, literary and views written by students, for students." />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/amaranth-logo.svg" />
    <link rel="alternate" type="application/rss+xml" title="Amaranth" href="/rss.xml" />
    <meta property="og:site_name" content="Amaranth" />
    <meta property="og:image" content="/og-default.jpg" />
    <title>Amaranth | The Official Student Media Organization of Visayas State University</title>
  </head>
  <body>
    <div id="root">
      <!-- shown until the app starts: the Amaranth mark, rotating -->
      <div role="status" style="min-height:100vh;display:grid;place-items:center">
        <img src="/amaranth-logo.svg" alt="" width="56" height="54" class="boot-logo" />
        <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading Amaranth</span>
      </div>
      <style>
        .boot-logo { animation: boot-spin 1.6s linear infinite; }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .boot-logo { animation: none; } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
